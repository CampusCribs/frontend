components:
  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, format: int32, minimum: 0, default: 0 }

    SizeParam:
      name: size
      in: query
      schema: { type: integer, format: int32, minimum: 1, maximum: 100, default: 20 }

    SortParam:
      name: sort
      in: query
      description: Sort by one or more fields, e.g. sort=priceMonthly,asc&sort=createdAt,desc
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true

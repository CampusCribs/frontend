components:
  schemas:
    PostTag:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          example: Walkable

    ProfileCribPost:
      type: object
      required:
      - type
      - id
      - title
      - description
      - imageUrl
      - isVerified
      - price
      - roommates
      - tags
      properties:
        type:
          type: string
          enum: [ CRIB ]
          example: CRIB

        id:
          type: string
          example: post_123

        title:
          type: string
          example: Sunny Private Room on Short Vine

        description:
          type: string
          example: >
            Private room in a 3BR. Walk to campus, in-unit laundry, furnished common area. Looking for someone clean + respectful.

        imageUrl:
          type: string
          format: uri
          example: https://images.unsplash.com/photo-1505693416388-ac5ce068fe85

        isVerified:
          type: boolean
          example: true

        price:
          type: number
          format: float
          example: 850

        roommates:
          type: integer
          example: 2

        tags:
          type: array
          items:
            $ref: "#/components/schemas/PostTag"

    CommunityPost:
      type: object
      required:
      - id
      - name
      - username
      - avatarUrl
      - intent
      - body
      - images
      - createdAt
      - likes
      - comments
      properties:
        id:
          type: string
          example: community_1

        name:
          type: string
          example: Johnny Edwards

        username:
          type: string
          example: johnnyedwards

        avatarUrl:
          type: string
          format: uri
          example: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3krGAS5w7YyUrBn7Y55sqCFh13aR2La_dYQ&s

        intent:
          type: string
          example: Looking for Roommate

        body:
          type: string
          example: Looking for a roommate to join me and my friends this semester. Chill group, close to campus.

        images:
          type: array
          items:
            type: string
            format: uri
          example:
          - https://images.unsplash.com/photo-1505691938895-1758d7feb511
          - https://images.unsplash.com/photo-1493809842364-78817add7ffb
          - https://images.unsplash.com/photo-1484154218962-a197022b5858
          - https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6

        createdAt:
          type: string
          description: Human-readable label for the UI (e.g., "2h ago")
          example: 2h ago

        likes:
          type: integer
          minimum: 0
          example: 24

        comments:
          type: integer
          minimum: 0
          example: 8

    PageCommunityPost:
      type: object
      required: [ items, page, size, totalElements, totalPages ]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommunityPost"
        page:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000
        size:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
          maximum: 20
        totalPages:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000

get:
  summary: List of chats for the user
  operationId: individualChat
  parameters:
  - in: path
    name: username
    required: true
    schema:
      type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/IndividualChat.yaml#/components/schemas/ChatResponseDTO

    "400":
      $ref: ../../components/responses/ErrorResponse.yaml#/components/responses/BadRequest

post:
  summary: Send a message to a user chat
  operationId: postMessage
  parameters:
  - in: path
    name: username
    required: true
    schema:
      type: string
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/IndividualChat.yaml#/components/schemas/PostMessageRequestDTO
  responses:
    "200":
      description: Message sent successfully
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/IndividualChat.yaml#/components/schemas/ChatMessageDTO
    "400":
      $ref: ../../components/responses/ErrorResponse.yaml#/components/responses/BadRequest

      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/posts/IndividualPost.yaml#/components/schemas/IndividualPost

    "400":
      $ref: ../../components/responses/ErrorResponse.yaml#/components/responses/BadRequest

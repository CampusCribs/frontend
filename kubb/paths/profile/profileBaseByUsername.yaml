get:
  parameters:
  - name: username
    in: path
    required: true
    schema:
      type: string
  summary: Get current user profile
  responses:
    "200":
      description: Profile data
      content:
        application/json:
          schema:
            $ref: "../../components/responses/profile/ProfileResponse.yaml#/components/responses/ProfileResponse"
    "400":
      $ref: ../../components/responses/ErrorResponse.yaml#/components/responses/BadRequest

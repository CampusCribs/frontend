get:
  summary: List curated cribs
  parameters:
  - $ref: ../../components/params/Pagination.yaml#/components/parameters/PageParam
  - $ref: ../../components/params/Pagination.yaml#/components/parameters/SizeParam
  - $ref: ../../components/params/Pagination.yaml#/components/parameters/SortParam
  - name: username
    in: path
    required: true
    schema:
      type: string
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/profile/ProfilePost.yaml#/components/schemas/CommunityPost
    "400":
      $ref: ../../components/responses/ErrorResponse.yaml#/components/responses/BadRequest

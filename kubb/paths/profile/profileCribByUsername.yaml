get:
  parameters:
  - name: username
    in: path
    required: true
    schema:
      type: string
  summary: Get current user profile
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/profile/ProfilePost.yaml#/components/schemas/ProfileCribPost
    "400":
      $ref: ../../components/responses/ErrorResponse.yaml#/components/responses/BadRequest

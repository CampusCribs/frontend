openapi: 3.0.3
info:
  title: CampusCribs API
  version: 1.0.0
paths:
  /app//me:
    get:
      tags:
        - User
      summary: Get current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /app/cribs:
    get:
      summary: List curated cribs
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResidenceCardDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
  /app/community:
    get:
      summary: List curated community posts
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageCommunityPost'
        '400':
          $ref: '#/components/responses/BadRequest'
  /app/individualcrib/{postId}:
    get:
      summary: get individual crib
      operationId: getIndividualCrib
      parameters:
        - in: path
          name: postId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualPost'
        '400':
          $ref: '#/components/responses/BadRequest'
  /app/profile/{username}:
    get:
      summary: List curated cribs
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - $ref: '#/components/parameters/SortParam'
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfilePageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - firstName
        - lastName
        - username
        - createdAt
        - role
        - verificationStatus
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        username:
          type: string
        newsletterConsent:
          type: boolean
        bio:
          type: string
        thumbnailMediaId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          description: Who posted the listing.
          enum:
            - STUDENT
            - LANDLORD
        verificationStatus:
          type: string
          description: Verification status of the poster.
          enum:
            - VERIFIED
            - UNVERIFIED
    Page:
      type: object
      required:
        - items
        - page
        - size
        - totalElements
        - totalPages
      properties:
        items:
          type: array
          items: {}
          example: []
        page:
          type: integer
          format: int32
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          minimum: 1
          example: 10
        totalElements:
          type: integer
          format: int64
          minimum: 0
          example: 42
        totalPages:
          type: integer
          format: int32
          minimum: 0
          example: 5
        sort:
          type: string
          nullable: true
          example: priceMonthly,asc
      example:
        items: []
        page: 0
        size: 10
        totalElements: 42
        totalPages: 5
        sort: null
    AvailabilityImmediate:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - IMMEDIATE
          example: IMMEDIATE
      example:
        type: IMMEDIATE
    AvailabilityDate:
      type: object
      required:
        - type
        - date
      properties:
        type:
          type: string
          enum:
            - DATE
          example: DATE
        date:
          type: string
          format: date
          description: ISO-8601 date (e.g., 2026-08-01)
          example: '2026-08-01'
      example:
        type: DATE
        date: '2026-08-01'
    ResidenceCardDTO:
      type: object
      description: Fields required to render the ResidenceCard component.
      required:
        - id
        - thumbnailUrl
        - locationLabel
        - priceMonthly
        - availability
        - role
        - verification
        - identity
      properties:
        id:
          type: string
          example: abc123
        thumbnailUrl:
          type: string
          format: uri
          example: https://images.unsplash.com/photo-1560185007-c5ca9d2c014d?auto=format&fit=crop&w=1400&q=80
        locationLabel:
          type: string
          example: Clifton · Cincinnati, OH
        priceMonthly:
          type: integer
          format: int32
          minimum: 0
          example: 875
        availability:
          description: Availability for the listing (either immediate or a specific date).
          oneOf:
            - $ref: '#/components/schemas/AvailabilityImmediate'
            - $ref: '#/components/schemas/AvailabilityDate'
          discriminator:
            propertyName: type
            mapping:
              IMMEDIATE: '#/components/schemas/AvailabilityImmediate'
              DATE: '#/components/schemas/AvailabilityDate'
          example:
            type: IMMEDIATE
        role:
          type: string
          description: Who posted the listing.
          enum:
            - STUDENT
            - LANDLORD
          example: LANDLORD
        verification:
          type: string
          description: Verification status of the poster.
          enum:
            - VERIFIED
            - UNVERIFIED
          example: VERIFIED
        identity:
          type: object
          description: Identity line shown on the card (company + university).
          required:
            - companyName
            - universityName
          properties:
            companyName:
              type: string
              example: Queen City Property Group
            universityName:
              type: string
              example: University of Cincinnati
          example:
            companyName: Queen City Property Group
            universityName: University of Cincinnati
      example:
        id: abc123
        thumbnailUrl: https://images.unsplash.com/photo-1560185007-c5ca9d2c014d?auto=format&fit=crop&w=1400&q=80
        locationLabel: Clifton · Cincinnati, OH
        priceMonthly: 875
        availability:
          type: DATE
          date: '2026-08-01'
        role: LANDLORD
        verification: VERIFIED
        identity:
          companyName: Queen City Property Group
          universityName: University of Cincinnati
    PageResidenceCardDTO:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ResidenceCardDTO'
      example:
        items:
          - id: abc123
            thumbnailUrl: https://images.unsplash.com/photo-1560185007-c5ca9d2c014d?auto=format&fit=crop&w=1400&q=80
            locationLabel: Clifton · Cincinnati, OH
            priceMonthly: 875
            availability:
              type: IMMEDIATE
            role: LANDLORD
            verification: VERIFIED
            identity:
              companyName: Queen City Property Group
              universityName: University of Cincinnati
        page: 0
        size: 10
        totalElements: 42
        totalPages: 5
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          example: priceMonthly
        message:
          type: string
          example: must be greater than or equal to 0
        rejectedValue:
          description: Optional rejected value.
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details with common extensions.
      required:
        - title
        - status
      properties:
        type:
          type: string
          description: A URI reference that identifies the problem type.
          example: https://api.campuscribs.com/problems/crib-not-found
        title:
          type: string
          example: Crib not found
        status:
          type: integer
          format: int32
          example: 404
        detail:
          type: string
          example: No crib exists with id 'abc123'.
        instance:
          type: string
          description: URI reference identifying the specific occurrence (often the request path).
          example: /cribs/abc123
        code:
          type: string
          description: Stable, machine-readable error code.
          example: CRIB_NOT_FOUND
        traceId:
          type: string
          description: Correlates client error with server logs/traces.
          example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
        errors:
          type: array
          description: Optional field validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
    CommunityPost:
      type: object
      required:
        - id
        - name
        - username
        - avatarUrl
        - intent
        - body
        - images
        - createdAt
        - likes
        - comments
      properties:
        id:
          type: string
          example: community_1
        name:
          type: string
          example: Johnny Edwards
        username:
          type: string
          example: johnnyedwards
        avatarUrl:
          type: string
          format: uri
          example: https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS3krGAS5w7YyUrBn7Y55sqCFh13aR2La_dYQ&s
        intent:
          type: string
          example: Looking for Roommate
        body:
          type: string
          example: Looking for a roommate to join me and my friends this semester. Chill group, close to campus.
        images:
          type: array
          items:
            type: string
            format: uri
          example:
            - https://images.unsplash.com/photo-1505691938895-1758d7feb511
            - https://images.unsplash.com/photo-1493809842364-78817add7ffb
            - https://images.unsplash.com/photo-1484154218962-a197022b5858
            - https://images.unsplash.com/photo-1502005229762-cf1b2da7c5d6
        createdAt:
          type: string
          description: Human-readable label for the UI (e.g., "2h ago")
          example: 2h ago
        likes:
          type: integer
          minimum: 0
          example: 24
        comments:
          type: integer
          minimum: 0
          example: 8
    PageCommunityPost:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CommunityPost'
    PostTag:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Private bedroom
    GeoLocation:
      type: object
      required:
        - lat
        - lng
        - label
      properties:
        lat:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 39.1279
        lng:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -84.5146
        label:
          type: string
          example: Near Short Vine
    IndividualPost:
      type: object
      required:
        - postId
        - userId
        - userThumbnailUrl
        - firstName
        - lastName
        - username
        - institutionName
        - title
        - description
        - price
        - roommates
        - termStartDate
        - termEndDate
        - tags
        - mediaIds
        - location
      properties:
        postId:
          type: string
          example: post_123
        userId:
          type: string
          example: user_abc
        userThumbnailUrl:
          type: string
          description: URL for the user's avatar/thumbnail (empty string allowed).
          example: ''
          default: ''
        firstName:
          type: string
          example: Johnny
        lastName:
          type: string
          example: Edwards
        username:
          type: string
          example: johnnyedwards
        institutionName:
          type: string
          example: University of California, Berkeley
        title:
          type: string
          example: Sunny Private Room on Short Vine
        description:
          type: string
          example: Private room in a 3BR. Walk to campus, in-unit laundry, furnished common area. Looking for someone clean + respectful. Close to restaurants and a bus stop.
        price:
          type: integer
          format: int32
          minimum: 0
          example: 850
        roommates:
          type: integer
          format: int32
          minimum: 0
          example: 2
        termStartDate:
          type: string
          format: date-time
          example: '2026-05-10T00:00:00.000Z'
        termEndDate:
          type: string
          format: date-time
          example: '2026-08-15T00:00:00.000Z'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/PostTag'
          example:
            - name: Private bedroom
            - name: In-unit laundry
        mediaIds:
          type: array
          items:
            type: string
          example:
            - m1
            - m2
            - m3
        location:
          $ref: '#/components/schemas/GeoLocation'
    ProfileRole:
      type: string
      enum:
        - LANDLORD
        - STUDENT
      example: LANDLORD
    VerificationStatus:
      type: string
      enum:
        - VERIFIED
        - UNVERIFIED
      example: VERIFIED
    BaseProfile:
      type: object
      required:
        - name
        - username
        - bio
        - email
        - phone
        - avatarUrl
        - role
        - verification
      properties:
        name:
          type: string
          example: John Doe
        username:
          type: string
          example: johndoe123
        bio:
          type: string
          example: College student passionate about finding the perfect off-campus housing!
        email:
          type: string
          format: email
          example: johndoe@example.com
        phone:
          type: string
          example: 555-123-4567
        avatarUrl:
          type: string
          format: uri
          example: https://images.unsplash.com/photo-1502685104226-ee32379fefbe?auto=format&fit=crop&w=400&q=80
        role:
          $ref: '#/components/schemas/ProfileRole'
        verification:
          $ref: '#/components/schemas/VerificationStatus'
    LandlordProfile:
      allOf:
        - $ref: '#/components/schemas/BaseProfile'
        - type: object
          required:
            - market
          properties:
            market:
              type: string
              example: Cincinnati, OH
    StudentProfile:
      allOf:
        - $ref: '#/components/schemas/BaseProfile'
        - type: object
          required:
            - school
          properties:
            school:
              type: string
              example: UC Berkeley
    Profile:
      oneOf:
        - $ref: '#/components/schemas/LandlordProfile'
        - $ref: '#/components/schemas/StudentProfile'
      discriminator:
        propertyName: role
        mapping:
          LANDLORD: '#/components/schemas/LandlordProfile'
          STUDENT: '#/components/schemas/StudentProfile'
    schemas-PostTag:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Walkable
    ProfileCribPost:
      type: object
      required:
        - type
        - id
        - title
        - description
        - imageUrl
        - isVerified
        - price
        - roommates
        - tags
      properties:
        type:
          type: string
          enum:
            - CRIB
          example: CRIB
        id:
          type: string
          example: post_123
        title:
          type: string
          example: Sunny Private Room on Short Vine
        description:
          type: string
          example: |
            Private room in a 3BR. Walk to campus, in-unit laundry, furnished common area. Looking for someone clean + respectful.
        imageUrl:
          type: string
          format: uri
          example: https://images.unsplash.com/photo-1505693416388-ac5ce068fe85
        isVerified:
          type: boolean
          example: true
        price:
          type: number
          format: float
          example: 850
        roommates:
          type: integer
          example: 2
        tags:
          type: array
          items:
            $ref: '#/components/schemas/schemas-PostTag'
    ProfilePageResponse:
      type: object
      required:
        - profile
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        cribs:
          nullable: true
          oneOf:
            - $ref: '#/components/schemas/PageResidenceCardDTO'
            - $ref: '#/components/schemas/ProfileCribPost'
          description: |
            Student profiles return a single featured crib post. Landlord profiles return a paged list of residence cards.
        community:
          $ref: '#/components/schemas/PageCommunityPost'
          nullable: true
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        example: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        example: 10
    SortParam:
      name: sort
      in: query
      required: false
      description: Sorting criteria (e.g. "priceMonthly,asc").
      schema:
        type: string
        example: priceMonthly,asc
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
